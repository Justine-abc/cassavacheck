services:
  - type: web
    name: cassacheck
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CASSACHECK_OFFICER_CODE
        sync: false
      # Hosted PostgreSQL address, pasted in the Render dashboard. Without it the log is SQLite and clears on restart.
      - key: DATABASE_URL
        sync: false
