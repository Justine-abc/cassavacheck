<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>CassaCheck result</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="icon" href="/static/favicon.svg?v=6" type="image/svg+xml"/>
<link rel="stylesheet" href="/static/app.css?v=6"/>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="/static/theme.js?v=6"></script>
<script src="/static/i18n.js?v=6"></script>
<script src="/static/app.js?v=6"></script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">
<div id="app-header"></div>
<main id="content" class="pt-20 pb-24 lg:pb-12 px-margin-mobile lg:px-8 max-w-3xl lg:max-w-6xl mx-auto flex flex-col gap-space-md"></main>
<div id="app-nav"></div>

<script>
renderHeader(T("Diagnosis result"), { back: true });
renderBottomNav("diagnose");

const stored = JSON.parse(sessionStorage.getItem("cassacheck_result") || "null");
const content = document.getElementById("content");
const answers = {};
let districtRows = [];

const card = (inner, accent = "") => `
  <section class="bg-surface-container-lowest rounded-xl p-space-lg border border-outline-variant/30 shadow-sm flex flex-col gap-space-sm relative overflow-hidden">
    ${accent ? `<div class="absolute left-0 top-0 bottom-0 w-1.5 ${accent}"></div>` : ""}${inner}
  </section>`;

const bullets = (items) => `<ul class="flex flex-col gap-2">${items.map((text) => `
  <li class="flex gap-2 font-body-md text-body-md"><span class="material-symbols-outlined text-[20px] text-secondary shrink-0">check_circle</span><span>${escapeHtml(T(text))}</span></li>`).join("")}</ul>`;

function photoBlock() {
  return stored.photo ? `<img src="${stored.photo}" alt="${T("The leaf you checked")}" class="w-full max-h-64 lg:max-h-[380px] object-cover rounded-xl"/>` : "";
}

// The farmer's leaf beside a labelled example of the named condition, when one exists.
function comparisonBlock(code) {
  if (!EXAMPLE_PHOTOS[code] || !stored.photo) return photoBlock();
  return `
    <div class="grid grid-cols-2 gap-2">
      <figure class="flex flex-col gap-1"><img src="${stored.photo}" alt="${T("The leaf you checked")}" class="w-full h-36 lg:h-48 object-cover rounded-xl"/>
        <figcaption class="font-label-md text-label-md text-center">${T("Your leaf")}</figcaption></figure>
      <figure class="flex flex-col gap-1"><img src="${EXAMPLE_PHOTOS[code].src}" alt="${T("Example of")} ${escapeHtml(diseaseName(code))}" class="w-full h-36 lg:h-48 object-cover rounded-xl"/>
        <figcaption class="font-label-md text-label-md text-center">${T("Known example")}</figcaption></figure>
    </div>
    <p class="font-label-sm text-label-sm text-on-surface-variant">${T("Compare the two. If they look very different, take another photo or ask an extension officer.")} ${T(EXAMPLE_PHOTOS[code].credit)}</p>`;
}

function probabilityBars(probabilities, highlight) {
  return Object.entries(probabilities).sort((a, b) => b[1] - a[1]).map(([name, value]) => `
    <div class="bg-surface-container-low rounded-lg px-3 py-2">
      <div class="flex justify-between font-body-sm text-body-sm ${name === highlight ? "font-bold text-primary" : ""}"><span>${name === "healthy" || LANG === "rw" ? diseaseName(name) : `${CLASS_LONG_NAMES[name]} (${name})`}</span><span>${percent(value)}</span></div>
      <div class="h-1.5 bg-surface-container-high rounded-full mt-1"><div class="bar-fill h-1.5 rounded-full ${name === highlight ? "bg-primary" : "bg-primary-container/60"}" data-width="${Math.max(1, value * 100)}%"></div></div>
    </div>`).join("");
}

function districtPanel(result) {
  if (!stored.district) return "";
  const text = LANG === "rw" ? districtSentenceRw(stored.district, districtRows)
    : result.district_panel || `No published survey value for ${stored.district} yet.`;
  return card(`
    <div class="flex items-center justify-between pl-1">
      <div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-secondary">public</span><h3 class="font-title-md text-title-md">${T("District information")}</h3></div>
      <span class="font-label-sm text-label-sm bg-surface-container px-2 py-1 rounded uppercase">${escapeHtml(stored.district)}</span>
    </div>
    <p class="font-body-md text-body-md pl-1">${escapeHtml(text)}</p>
    <p class="flex gap-2 items-start bg-surface-container-low rounded-lg px-3 py-2 font-body-sm text-body-sm italic text-on-surface-variant">
      <span class="material-symbols-outlined text-[18px] not-italic">info</span>${T("This is published survey information for the district. It is not a probability for this leaf and did not change the diagnosis.")}</p>`, "bg-secondary");
}

async function sendFollowUp(referralRequested) {
  const response = await fetch("/follow_up", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ diagnosis_id: stored.result.diagnosis_id, answers, referral_requested: referralRequested }) });
  if (!response.ok) throw new Error("Could not reach the server. Try again.");
  return response.json();
}

// Referral: the farmer chooses whether the officer may call. Without consent no number is asked for or sent.
function referralForm(target) {
  showAnimated(target, card(`
    <div class="flex items-center gap-2"><span class="w-9 h-9 rounded-lg bg-secondary-fixed flex items-center justify-center"><span class="material-symbols-outlined text-[20px] text-secondary">support_agent</span></span>
      <h3 class="font-title-md text-title-md">${T("Send to the extension officer")}</h3></div>
    <p class="font-body-sm text-body-sm text-on-surface-variant">${T("The officer sees the result, your district and your answers. Your photo is not sent.")}</p>
    <label class="flex gap-3 items-start bg-surface-container-low rounded-lg px-3 py-3 cursor-pointer">
      <input id="contact-consent" type="checkbox" class="mt-1 w-5 h-5 accent-[#2c5f2d] shrink-0"/>
      <span class="font-body-md text-body-md">${T("I agree that the extension officer may call me about this case.")}</span>
    </label>
    <div id="phone-block" class="hidden flex flex-col gap-1">
      <label for="contact-phone" class="font-label-lg text-label-lg">${T("Phone number")}</label>
      <input id="contact-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0788 123 456" class="h-12 rounded-lg border border-outline-variant bg-surface-container-low px-3 font-body-lg text-body-lg"/>
      <p class="font-body-sm text-body-sm text-on-surface-variant">${T("Used only for this case. It is deleted when the officer answers, or after 30 days.")}</p>
    </div>
    <p id="referral-error" class="hidden font-body-sm text-body-sm text-error"></p>
    <button id="send-referral" class="h-12 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[20px]">send</span>${T("Send")}</button>`));
  const consent = document.getElementById("contact-consent");
  consent.onchange = () => document.getElementById("phone-block").classList.toggle("hidden", !consent.checked);
  document.getElementById("send-referral").onclick = async () => {
    const error = document.getElementById("referral-error");
    const phone = consent.checked ? document.getElementById("contact-phone").value.trim() : "";
    if (consent.checked && !phone) { error.textContent = T("Enter your phone number, or untick the box."); error.classList.remove("hidden"); return; }
    try {
      const response = await fetch("/referral", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ diagnosis_id: stored.result.diagnosis_id, answers, contact_consent: consent.checked, phone: phone || null }) });
      const body = await response.json();
      if (!response.ok) throw new Error(T(body.detail || "Could not reach the server. Try again."));
      stored.referral = body;
      sessionStorage.setItem("cassacheck_result", JSON.stringify(stored));
      rememberCase(body.case_number, body.check_code);
      referralConfirmation(target);
    } catch (problem) {
      error.textContent = problem.message === "Failed to fetch" ? T("Could not reach the server. Try again.") : problem.message;
      error.classList.remove("hidden");
    }
  };
}

function referralConfirmation(target) {
  const { case_number, check_code, contact_saved } = stored.referral;
  showAnimated(target, `
    <div class="flex flex-col gap-2 bg-primary-fixed text-on-primary-fixed rounded-lg px-3 py-3 font-body-md text-body-md">
      <span class="flex gap-2 items-start"><span class="material-symbols-outlined text-[22px]">mark_email_read</span>
        <span>${T("Sent to the extension officer.")} ${contact_saved ? T("The officer can call you.") : T("Show this case number to your farmer promoter or sector agronomist.")}</span></span>
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-surface-container-lowest rounded-lg py-2"><span class="font-label-sm text-label-sm uppercase block">${T("Case number")}</span><b class="font-headline-sm text-headline-sm">#${case_number}</b></div>
        <div class="bg-surface-container-lowest rounded-lg py-2"><span class="font-label-sm text-label-sm uppercase block">${T("Check code")}</span><b class="font-headline-sm text-headline-sm tracking-widest">${escapeHtml(check_code)}</b></div>
      </div>
      <span class="font-body-sm text-body-sm">${T("Write both down or take a screenshot. You need them to read the officer's answer.")}</span>
      <a href="/my-case?case=${case_number}&code=${encodeURIComponent(check_code)}" class="press h-12 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[20px]">inbox</span>${T("Open My case")}</a>
      <span class="font-body-sm text-body-sm">${T("No answer after 3 days? Go to your sector agronomist's office and show this case number.")}</span>
    </div>`);
}

function referralArea(primary) {
  if (stored.referral) return `<div id="referral-area"></div>`;
  return `<div id="referral-area">
      <button id="refer-button" class="w-full h-14 rounded-lg ${primary ? "bg-primary text-on-primary" : "border-2 border-primary text-primary"} font-title-md text-title-md flex items-center justify-center gap-2"><span class="material-symbols-outlined">support_agent</span>${T(primary ? "Send to extension officer" : "Ask an extension officer")}</button>
    </div>`;
}

function wireReferral() {
  if (stored.referral) { referralConfirmation("referral-area"); return; }
  document.getElementById("refer-button").onclick = () => referralForm("referral-area");
}

// One column on a phone; on a laptop or projector the photo and decision sit on the left, the next steps on the right.
function twoColumns(back, left, right) {
  content.innerHTML = `${back}
    <div class="grid gap-space-md lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)] lg:gap-6 lg:items-start">
      <div id="left-column" class="flex flex-col gap-space-md lg:sticky lg:top-20">${left}</div>
      <div id="right-column" class="flex flex-col gap-space-md">${right}</div>
    </div>`;
  reveal(document.getElementById("left-column")); reveal(document.getElementById("right-column"));
  fillBars();
}

function showAnimated(target, html) {
  const area = document.getElementById(target);
  area.innerHTML = html; reveal(area);
  area.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function renderConfident(result) {
  twoColumns(`<a href="/" class="press self-start flex items-center gap-1 text-primary font-label-lg text-label-lg uppercase"><span class="material-symbols-outlined text-[20px]">arrow_back</span>${T("Check another leaf")}</a>`, `
    ${card(`
      <span class="self-start flex items-center gap-1 bg-primary text-on-primary px-2.5 py-1 rounded-full font-label-md text-label-md uppercase"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings:'FILL' 1">check_circle</span>${T("Diagnosis")}</span>
      <h2 class="font-headline-md-mobile text-headline-md-mobile">${result.decision === "healthy" ? T("Healthy leaf") : LANG === "rw" ? escapeHtml(diseaseName(result.decision)) : `${escapeHtml(result.label_long)} (${escapeHtml(result.decision)})`}</h2>
      ${comparisonBlock(result.decision)}
      <div class="bg-surface-container-low rounded-lg px-3 py-2">
        <span class="font-label-lg text-label-lg uppercase">${T("Confidence")}</span> <span class="font-headline-md text-headline-md text-primary">${percent(result.confidence)}</span>
        <div class="mt-2">${confidenceMeter(result.confidence, result.threshold)}</div>
        <p class="font-body-sm text-body-sm text-on-surface-variant">${T("On photos the model did not learn from, answers at this confidence were right about this often.")}</p>
      </div>
      <span class="font-label-md text-label-md uppercase text-on-surface-variant mt-1">${T("All five conditions")}</span>
      ${probabilityBars(result.probabilities, result.decision)}`)}`, `
    ${card(`
      <div class="flex items-center gap-2"><span class="w-9 h-9 rounded-lg bg-secondary-fixed flex items-center justify-center"><span class="material-symbols-outlined text-[20px] text-secondary">eco</span></span>
        <div><span class="font-label-sm text-label-sm text-secondary uppercase">${T("What to do")}</span><h3 class="font-title-md text-title-md">${T("Management advice")}</h3></div></div>
      ${bullets(result.advice)}
      <p class="font-body-sm text-body-sm text-on-surface-variant">${T("Management steps only. CassaCheck never recommends a chemical or a dose.")}</p>
      ${result.decision === "healthy" ? "" : `<a href="/diseases#${escapeHtml(result.decision)}" class="press self-start flex items-center gap-1 text-primary font-label-lg text-label-lg"><span class="material-symbols-outlined text-[20px]">menu_book</span>${T("About this disease: cause, spread, prevention")}</a>`}`)}
    ${districtPanel(result)}
    ${referralArea(true)}`);
  wireReferral();
}

function questionCard(question) {
  return `
    <div class="bg-surface-container-lowest rounded-xl p-space-md border border-outline-variant/30 shadow-sm">
      <p class="font-title-md text-title-md mb-2">${escapeHtml(T(question.question))}</p>
      <div class="grid grid-cols-1 sm:grid-cols-${Math.min(question.options.length, 2)} gap-2">
        ${question.options.map((option) => `
          <button type="button" data-question="${question.id}" data-option="${escapeHtml(option)}"
            class="answer min-h-[48px] rounded-lg border border-outline-variant/60 bg-surface-container-low font-body-md text-body-md px-4 text-left flex items-center justify-between">
            <span>${escapeHtml(T(option))}</span><span class="material-symbols-outlined text-[20px] hidden">check_circle</span></button>`).join("")}
      </div>
    </div>`;
}

function renderNotSure(result) {
  twoColumns(`<a href="/" class="press self-start flex items-center gap-1 text-primary font-label-lg text-label-lg uppercase"><span class="material-symbols-outlined text-[20px]">photo_camera</span>${T("Take another photo")}</a>`, `
    ${card(`
      <div class="flex items-start justify-between gap-2 pl-1">
        <span class="flex items-center gap-1 bg-secondary-fixed text-on-secondary-fixed px-2.5 py-1 rounded-full font-label-md text-label-md whitespace-nowrap"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings:'FILL' 1">help</span>${T("Not sure")}</span>
        <div class="text-right"><span class="font-label-sm text-label-sm uppercase text-on-surface-variant block">${T("Confidence")}</span>
          <span class="font-title-md text-title-md text-secondary">${percent(result.confidence)}, ${T("below the threshold of")} ${percent(result.threshold)}</span></div>
      </div>
      <h2 class="font-headline-md-mobile text-headline-md-mobile pl-1">${T("Not sure from this photo")}</h2>
      <p class="font-body-md text-body-md text-on-surface-variant pl-1">${T("The model is not confident enough to name a condition for this leaf, so it does not guess. Answer the questions for advice, or send the case to an extension officer. Your answers do not change the diagnosis.")}</p>
      <div class="pl-1">${confidenceMeter(result.confidence, result.threshold)}</div>
      ${photoBlock()}`, "bg-secondary")}`, `
    <div class="flex items-center justify-between px-1">
      <span class="font-label-sm text-label-sm uppercase text-on-surface-variant">${T("What do you see in the field?")}</span>
      <span class="font-label-sm text-label-sm text-primary">${result.follow_up_questions.length} ${T("questions")}</span>
    </div>
    ${result.follow_up_questions.map(questionCard).join("")}
    <button id="advice-button" disabled class="h-14 rounded-lg bg-primary text-on-primary font-title-md text-title-md flex items-center justify-center gap-2 disabled:bg-surface-container-high disabled:text-on-surface-variant">
      <span class="material-symbols-outlined">lightbulb</span>${T("Get advice")}</button>
    <div id="advice-area"></div>
    ${referralArea(false)}
    ${districtPanel(result)}
    <details class="bg-surface-container-low rounded-xl px-space-lg py-space-md">
      <summary class="font-label-lg text-label-lg cursor-pointer">${T("Details for the extension officer")}</summary>
      <p class="font-body-sm text-body-sm text-on-surface-variant my-2">${T("Calibrated probabilities. None reached the threshold, so no condition is named.")} (${percent(result.threshold)})</p>
      <div class="flex flex-col gap-2">${probabilityBars(result.probabilities, null)}</div>
    </details>`);
  document.querySelector("details").addEventListener("toggle", (event) => event.target.open && fillBars(event.target));

  document.querySelectorAll(".answer").forEach((button) => button.onclick = () => {
    answers[button.dataset.question] = button.dataset.option;
    document.querySelectorAll(`.answer[data-question="${button.dataset.question}"]`).forEach((other) => {
      const chosen = other === button;
      other.classList.toggle("bg-primary", chosen); other.classList.toggle("text-on-primary", chosen);
      other.classList.toggle("bg-surface-container-low", !chosen);
      other.querySelector(".material-symbols-outlined").classList.toggle("hidden", !chosen);
    });
    document.getElementById("advice-button").disabled = false;
  });

  document.getElementById("advice-button").onclick = async () => {
    try {
      const reply = await sendFollowUp(false);
      const notes = reply.guidance.length ? reply.guidance : ["Your answers do not point to anything specific. Follow the steps below."];
      showAnimated("advice-area", card(`
        <div class="flex items-center gap-2"><span class="w-9 h-9 rounded-lg bg-secondary-fixed flex items-center justify-center"><span class="material-symbols-outlined text-[20px] text-secondary">lightbulb</span></span>
          <div><span class="font-label-sm text-label-sm text-secondary uppercase">${T("From your answers")}</span><h3 class="font-title-md text-title-md">${T("What this tells us")}</h3></div></div>
        ${bullets(notes)}
        <h3 class="font-title-md text-title-md mt-2">${T("What to do now")}</h3>
        ${bullets(result.advice)}`));
    } catch (error) { alert(T(error.message)); }
  };

  wireReferral();
}

if (!stored) {
  content.innerHTML = card(`<h2 class="font-headline-sm text-headline-sm">${T("No result yet")}</h2><p>${T("Check a leaf first.")}</p>
    <a href="/" class="h-12 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center">${T("Go to diagnose")}</a>`);
} else {
  // The Kinyarwanda district sentence is built here from the published rows; the English one comes from the API.
  (LANG === "rw" && stored.district ? fetch("/districts").then((r) => r.json()).catch(() => []) : Promise.resolve([])).then((rows) => {
    districtRows = rows;
    stored.result.decision === "abstain" ? renderNotSure(stored.result) : renderConfident(stored.result);
  });
}
</script>
</body>
</html>
